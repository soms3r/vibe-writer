<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Zen Scribe</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #0a0a0a;
  --border: #1a1a1a;
  --text: #d4d4d4;
  --text-dim: #555;
  --text-muted: #6b6b6b;
  --accent: #888;
  --accent-hover: #ccc;
  --font: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Liberation Mono', monospace;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Top Bar ---- */
.top-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1.25rem;
  padding: 0.65rem 1.5rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  flex-shrink: 0;
  user-select: none;
  background: var(--bg);
  z-index: 10;
}

.metric-sep {
  opacity: 0.3;
}

.save-indicator {
  margin-left: 1rem;
  font-size: 0.6rem;
  color: var(--text-dim);
  transition: opacity 0.4s ease;
  opacity: 0;
}

.save-indicator.visible {
  opacity: 0.7;
}

/* ---- Canvas ---- */
.canvas {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 2.5rem 2rem;
  overflow: hidden;
}

textarea {
  width: 100%;
  max-width: 720px;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 2;
  resize: none;
  padding: 0;
}

textarea::placeholder {
  color: var(--text-dim);
  opacity: 0.4;
}

textarea::-webkit-scrollbar {
  width: 6px;
}

textarea::-webkit-scrollbar-track {
  background: transparent;
}

textarea::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

textarea::-webkit-scrollbar-thumb:hover {
  background: var(--text-dim);
}

/* ---- Bottom Bar ---- */
.bottom-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1.5rem;
  padding: 0.65rem 1.5rem;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
  z-index: 10;
}

.bottom-bar button {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font);
  font-size: 0.75rem;
  letter-spacing: 0.03em;
  cursor: pointer;
  padding: 0.25rem 0.5rem;
  transition: color 0.2s ease;
  border-radius: 3px;
}

.bottom-bar button:hover {
  color: var(--accent-hover);
}

.bottom-bar button:active {
  color: var(--text);
}

.btn-divider {
  width: 1px;
  height: 14px;
  background: var(--border);
}

/* ---- Empty State ---- */
textarea:placeholder-shown {
  cursor: text;
}

/* ---- Responsive ---- */
@media (max-width: 600px) {
  .top-bar {
    font-size: 0.6rem;
    gap: 0.75rem;
    padding: 0.5rem 1rem;
  }

  .canvas {
    padding: 1.5rem 1rem;
  }

  textarea {
    font-size: 0.95rem;
    line-height: 1.9;
  }

  .bottom-bar {
    gap: 1rem;
    padding: 0.5rem 1rem;
  }

  .bottom-bar button {
    font-size: 0.7rem;
  }

  .save-indicator {
    display: none;
  }
}
</style>
</head>
<body>

<header class="top-bar" role="banner">
  <span class="metric" id="wordMetric">0 words</span>
  <span class="metric-sep">·</span>
  <span class="metric" id="charMetric">0 chars</span>
  <span class="metric-sep">·</span>
  <span class="metric" id="readMetric">&lt;1 min read</span>
  <span class="save-indicator" id="saveIndicator">Saved</span>
</header>

<main class="canvas" role="main">
  <textarea id="editor" placeholder="Start writing…" spellcheck="true" autofocus></textarea>
</main>

<footer class="bottom-bar" role="contentinfo">
  <button id="copyBtn">Copy</button>
  <span class="btn-divider"></span>
  <button id="downloadBtn">Download</button>
  <span class="btn-divider"></span>
  <button id="clearBtn">Clear</button>
</footer>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'zen-scribe-draft';
  const SAVE_INTERVAL = 2000;

  const editor = document.getElementById('editor');
  const wordMetric = document.getElementById('wordMetric');
  const charMetric = document.getElementById('charMetric');
  const readMetric = document.getElementById('readMetric');
  const saveIndicator = document.getElementById('saveIndicator');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const clearBtn = document.getElementById('clearBtn');

  let saveTimer = null;
  let hideSaveTimeout = null;

  /* ---- Metrics ---- */
  function updateMetrics() {
    var text = editor.value;
    var chars = text.length;
    var words = text.trim() ? text.trim().split(/\s+/).length : 0;
    var mins = Math.ceil(words / 200);

    charMetric.textContent = chars + ' char' + (chars !== 1 ? 's' : '');
    wordMetric.textContent = words + ' word' + (words !== 1 ? 's' : '');

    if (mins < 1) {
      readMetric.textContent = '<1 min read';
    } else {
      readMetric.textContent = mins + ' min read';
    }
  }

  /* ---- Auto-Save ---- */
  function saveDraft() {
    try {
      localStorage.setItem(STORAGE_KEY, editor.value);
      showSaved();
    } catch (e) {
      /* localStorage may be full or unavailable */
    }
  }

  function showSaved() {
    saveIndicator.classList.add('visible');
    if (hideSaveTimeout) clearTimeout(hideSaveTimeout);
    hideSaveTimeout = setTimeout(function () {
      saveIndicator.classList.remove('visible');
    }, 1500);
  }

  function loadDraft() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) {
        editor.value = saved;
        updateMetrics();
      }
    } catch (e) {
      /* ignore */
    }
  }

  /* ---- Events ---- */
  editor.addEventListener('input', function () {
    updateMetrics();
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, SAVE_INTERVAL);
  });

  /* Also save immediately on blur */
  editor.addEventListener('blur', function () {
    if (saveTimer) clearTimeout(saveTimer);
    saveDraft();
  });

  /* ---- Copy ---- */
  copyBtn.addEventListener('click', function () {
    var text = editor.value;
    if (!text) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
    } catch (e) {
      /* fallback failed */
    }
    document.body.removeChild(ta);
  }

  /* ---- Download ---- */
  downloadBtn.addEventListener('click', function () {
    var text = editor.value;
    if (!text) return;

    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var ts = now.getFullYear() + '-' +
             pad(now.getMonth() + 1) + '-' +
             pad(now.getDate()) + '-' +
             pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    var filename = 'draft-' + ts + '.md';

    var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  /* ---- Clear ---- */
  clearBtn.addEventListener('click', function () {
    if (!editor.value) return;
    if (confirm('Clear the entire canvas? This cannot be undone.')) {
      editor.value = '';
      updateMetrics();
      saveDraft();
    }
  });

  /* ---- Init ---- */
  loadDraft();

  /* Save indicator starts hidden; show briefly after load if content exists */
  if (editor.value) {
    showSaved();
  }
})();
</script>

</body>
</html>
